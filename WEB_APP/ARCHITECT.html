<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZION :: ARCHITECT</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #111;
            --text: #888;
            --accent: #d46bf7;
            /* Purple for Architect */
            --accent-dim: rgba(212, 107, 247, 0.2);
            --border: #333;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        h1 {
            color: #fff;
            text-transform: uppercase;
            font-weight: 200;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px var(--accent-dim);
            text-align: center;
        }

        .role {
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .panel:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-dim);
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 4px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: #fff;
        }

        .drop-zone p {
            margin: 0;
            font-size: 1.2rem;
            pointer-events: none;
        }

        .drop-zone span {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #555;
            pointer-events: none;
        }

        input[type="file"] {
            display: none;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            border: 1px solid var(--border);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            margin-top: 20px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: #555;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            width: 100%;
            transition: all 0.2s;
        }

        button:hover {
            box-shadow: 0 0 15px var(--accent);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .status {
            margin-top: 20px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            height: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>ZION</h1>
        <div class="role">Omnibus Architect Tool</div>

        <div class="panel">
            <div class="drop-zone" id="dropZone">
                <p>DROP FILE HERE</p>
                <span>or click to select</span>
            </div>
            <input type="file" id="fileInput">

            <div class="stats" id="stats">
                <span>ORIGINAL: 0 KB</span>
                <span>COMPRESSED: 0 KB</span>
                <span>RATIO: 0%</span>
            </div>

            <textarea id="output" readonly
                placeholder="COMPRESSED PAYLOAD WILL APPEAR HERE (READY FOR INTERNAL_LIBRARY)"></textarea>
            <button id="copyBtn">COPY TO CLIPBOARD</button>
        </div>

        <div class="status" id="status">WAITING FOR INPUT...</div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const copyBtn = document.getElementById('copyBtn');

        // Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        // Core Logic
        async function handleFile(file) {
            if (!file) return;

            status.textContent = 'READING...';

            try {
                // 1. Read File
                const rawBuffer = await file.arrayBuffer();
                const originalSize = rawBuffer.byteLength;

                status.textContent = 'COMPRESSING (GZIP)...';

                // 2. Compress (GZIP)
                const stream = new Blob([rawBuffer]).stream().pipeThrough(new CompressionStream('gzip'));
                const compressedBlob = await new Response(stream).blob();
                const compressedBuffer = await compressedBlob.arrayBuffer();

                status.textContent = 'ENCODING (BASE64)...';

                // 3. Encode Base64
                // Using logic to handle large files slightly better (chunking) if needed, but standard btoa usually ok for <10MB.
                // For robustness let's use a FileReader for the blob.
                const reader = new FileReader();
                reader.readAsDataURL(compressedBlob);

                reader.onloadend = () => {
                    const base64data = reader.result.split(',')[1];
                    const finalSize = base64data.length; // Approximate bytes for string

                    // Update UI
                    output.value = base64data;

                    const ratio = ((1 - (finalSize / originalSize)) * 100).toFixed(1);

                    document.getElementById('stats').innerHTML = `
                    <span>ORIG: ${(originalSize / 1024).toFixed(1)} KB</span>
                    <span>GZIP: ${(compressedBlob.size / 1024).toFixed(1)} KB</span>
                    <span>B64: ${(finalSize / 1024).toFixed(1)} KB</span>
                `;

                    status.textContent = '✓ COMPRESSED: ' + file.name;
                    status.style.color = '#d46bf7';
                };

            } catch (e) {
                status.textContent = '❌ ERROR: ' + e.message;
                status.style.color = 'red';
                console.error(e);
            }
        }

        // Copy Utility
        copyBtn.addEventListener('click', () => {
            if (!output.value) return;
            output.select();
            navigator.clipboard.writeText(output.value).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'COPIED!';
                setTimeout(() => copyBtn.textContent = originalText, 2000);
            });
        });

    </script>

</body>

</html>
