<!doctype html>
<html lang="es" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-0EEZHS0dIeCXi30mkADD5I7EEbiydV/UAVg9LYBlKdk=' 'wasm-unsafe-eval'; style-src 'sha256-1q4ayHfXNhbd2oRlIqAtNuunZ8uIggjJS4uo2NS4Cvg='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Notas</title>
<style>html{--bg:#f5f5f5;--fg:#111111;--mu:#6b6b6b;--ln:#dddddd;--cd:#fff;--ac:#111111;--hl:rgba(0,0,0,.16);--pu:#000;--fs:18px;color-scheme:light}
@media(prefers-color-scheme:dark){html{--bg:#121212;--fg:#ececec;--mu:#999999;--ln:#2c2c2c;--cd:#1c1c1c;--ac:#f0f0f0;--hl:rgba(255,255,255,.2);--pu:#fff;color-scheme:dark}}
html.l{--bg:#f5f5f5;--fg:#111111;--mu:#6b6b6b;--ln:#dddddd;--cd:#fff;--ac:#111111;--hl:rgba(0,0,0,.16);--pu:#000;color-scheme:light}
html.d{--bg:#121212;--fg:#ececec;--mu:#999999;--ln:#2c2c2c;--cd:#1c1c1c;--ac:#f0f0f0;--hl:rgba(255,255,255,.2);--pu:#fff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:0 auto;height:100%;position:relative}
.cv,.rd,.lv,.ed{height:100%}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
[dir=rtl] .fl .i{transform:scaleX(-1)}
.lv{overflow:auto;-webkit-overflow-scrolling:touch}
.hd{padding:28px 20px 6px}
.hd h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em}
.sf{padding:8px 16px 4px;margin:0}
.sf input,.fv input,.fm input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);font-size:16px;outline:0;-webkit-appearance:none;appearance:none}
.sf input:focus,.fv input:focus,.fm input:focus{border-color:var(--ac)}
.ls{list-style:none;margin:0;padding:6px 16px 104px}
.ls li{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}
.ls b,.ls span,.ls i{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls b{font-size:16px;font-weight:600}
.ls span{color:var(--mu);font-size:14px;margin-top:2px}
.ls i{color:var(--mu);font-size:12px;font-style:normal;margin-top:6px}
.em{color:var(--mu);text-align:center;padding:48px 20px;margin:0}
.fab{position:absolute;bottom:24px;inset-inline-end:20px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.22)}
html.d .fab,html.d .pb{color:#121212}
@media(prefers-color-scheme:dark){html:not(.l) .fab,html:not(.l) .pb{color:#121212}}
.ed,.rd{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--ln);flex:none;min-height:54px}
.gr{flex:1}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ib:active,.tt:active,.it:active{background:var(--ln)}
.ed textarea{flex:1;width:100%;border:0;outline:0;resize:none;background:none;padding:18px 20px;font-size:var(--fs);line-height:1.6}
.tt{flex:1;min-width:0;height:44px;border:0;background:none;border-radius:12px;font-size:17px;font-weight:600;text-align:start;padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 20px 32px}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.gd hr{grid-column:1/-1;width:100%;border:0;border-top:1px solid var(--ln);margin:8px 0}
.bk,.ch{border:1px solid var(--ln);background:var(--cd);border-radius:12px;font-size:16px}
.bk{text-align:start;padding:12px 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.ch{height:54px;padding:0;font-variant-numeric:tabular-nums}
.bk:active,.ch:active,.ht:active,.lg .on{border-color:var(--ac)}
.lg{grid-template-columns:1fr}
.dd{margin:36px 8px 24px;text-align:center;color:var(--pu);font-size:14px;line-height:1.6}
.dd h2{font-size:12px;letter-spacing:.12em;font-weight:600;margin:0 0 12px}
.dd p{margin:0 0 8px}
.dd b{font-weight:700}
.tx{font-family:ui-serif,Georgia,"Noto Serif","Times New Roman",serif;font-size:var(--fs);line-height:1.75;max-width:36em;margin:0 auto;overflow-wrap:break-word}
.tx h2{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:1.35em;line-height:1.25;margin:.2em 0 1em;font-weight:700}
.tx p{margin:0 0 .85em}
.tx sup{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:.58em;font-weight:700;color:var(--ac);margin-inline-end:.3em;line-height:0;vertical-align:super;user-select:none;-webkit-user-select:none}
.tx .k-s,.tx .k-S,.tx .k-a,.tx .k-r{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.tx .k-s{font-size:.88em;font-weight:700;margin:1.5em 0 .5em;line-height:1.35}
.tx .k-S{font-size:.8em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin:1.6em 0 .6em;color:var(--mu)}
.tx .k-a{font-size:.8em;font-weight:700;color:var(--mu);margin:1.2em 0 .3em}
.tx .k-r{font-size:.72em;color:var(--mu);margin:-.2em 0 .9em;line-height:1.4}
.tx .k-d{font-style:italic;color:var(--mu);margin-bottom:.6em}
.tx .k-m{margin-bottom:.85em}
.tx .k-pi{margin-inline-start:1.4em}
.tx .k-q1,.tx .k-q2,.tx .k-q3,.tx .k-l1,.tx .k-l2{margin-bottom:0;text-indent:-1.2em}
.tx .k-q1,.tx .k-l1{padding-inline-start:1.2em}
.tx .k-q2,.tx .k-l2{padding-inline-start:2.6em}
.tx .k-q3{padding-inline-start:4em}
.tx .k-c{text-align:center}
.tx .k-e{text-align:end}
.tx .k-b{height:.85em}
.tx .on{background:var(--hl);border-radius:4px}
.pn{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;border-top:1px solid var(--ln)}
.pn[hidden]{display:none}
.rg{width:28px;height:28px;transform:rotate(-90deg);flex:none}
.rg circle{fill:none;stroke-width:2.5}
.rk{stroke:var(--ln)}
.rv{stroke:var(--fg);stroke-dasharray:56.55;stroke-dashoffset:0;animation:rg 30s linear forwards}
@keyframes rg{to{stroke-dashoffset:56.55}}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--cd);display:flex;align-items:center;justify-content:center}
.mn{position:absolute;top:56px;inset-inline-end:8px;z-index:5;min-width:236px;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.it{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:11px 12px;text-align:start;font-size:16px}
.fr{display:flex;align-items:center;gap:4px;padding-inline-start:12px}
.fr span{flex:1}
.fv input{margin-bottom:12px}
.pr{display:block;height:2px;width:0;background:var(--ac);border-radius:2px;margin:-4px 0 6px}
.ht{display:block;width:100%;text-align:start;border:1px solid var(--ln);background:var(--cd);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:15px;line-height:1.5}
.ht b{display:block;font-size:13px;color:var(--ac);margin-bottom:2px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.fm{max-width:26em;margin:0 auto}
.fm label{display:block;font-size:14px;color:var(--mu);margin:14px 0 6px}
.fm label input{display:block;margin-top:6px;color:var(--fg)}
.fm select{display:block;width:100%;margin-top:6px;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);color:var(--fg);font-size:16px}
.ck{border:0;padding:0;margin:16px 0 0;min-width:0}
.ck legend{font-size:14px;color:var(--mu);padding:0;margin-bottom:2px}
.fm .ck label{display:flex;align-items:center;gap:12px;margin:0;padding:9px 0;color:var(--fg);font-size:16px}
.fm .ck input{display:block;flex:none;width:20px;height:20px;margin:0;padding:0;accent-color:var(--ac);-webkit-appearance:auto;appearance:auto}
.fm p{margin:0 0 6px;line-height:1.55}
.fm p.wn{font-weight:600;border-inline-start:3px solid var(--ac);padding-inline-start:10px;margin:8px 0 10px}
.fm .hi{font-size:13px;color:var(--mu);margin:6px 0 0}
.fm .er{color:var(--ac);min-height:1.5em;margin:10px 0 4px;font-size:14px}
.pb,.sb{display:block;width:100%;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;margin:10px 0}
.pb{border:0;background:var(--ac);color:#fff}
.sb{border:1px solid var(--ln);background:var(--cd)}
.ck .tg{width:auto;padding:7px 14px;font-size:14px;font-weight:500;margin:6px 0 4px}
.pb:disabled{opacity:.5}
.ab h3{margin:0 0 10px;font-size:20px}
.ab p{white-space:pre-wrap;line-height:1.6;margin:0 0 16px}
.ab .nt{color:var(--mu);font-size:14px;border-top:1px solid var(--ln);padding-top:16px}
.fm .ks{margin:6px 0 4px;padding:10px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);font-size:14px;color:var(--mu)}
.fm .ks .kv{margin:6px 0 8px;font:600 20px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:var(--fg);text-align:start;unicode-bidi:isolate;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fm .ks .kv[hidden]{display:none}
.fm .ks .sb{color:var(--fg);margin:0}
.fi{margin:0 0 16px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);font-size:15px;line-height:1.5}
.fi p{margin:0 0 10px}
.fi .sb{display:block;width:auto;margin:0 0 0 auto;margin-inline-start:auto;margin-inline-end:0;padding:6px 16px;border:1px solid var(--ln);border-radius:10px;background:none;color:var(--fg);font:inherit}
.fm textarea{display:block;width:100%;min-height:7.5em;margin:10px 0 0;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);color:var(--fg);font-size:16px;outline:0;resize:vertical;-webkit-appearance:none;appearance:none}
.fm textarea:focus{border-color:var(--ac)}
.fm .cd{margin:6px 0 4px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);font:600 17px/1.7 ui-monospace,Menlo,Consolas,monospace;word-spacing:.2em;text-align:left;unicode-bidi:isolate;overflow-wrap:break-word;user-select:all;-webkit-user-select:all}
.iv{height:100%;overflow:auto;-webkit-overflow-scrolling:touch;padding:28px 20px 40px}
</style>
</head>
<body>
<script type="application/json" id="u">{"es":{"dir":"ltr","a":"Alguien quiere mandarte un archivo que solo tú podrás abrir. Para eso necesitas una clave: la crea esta página y no sale de tu teléfono.","b":"Apúntala en papel, nunca en una nota ni en el chat. Si sales de esta página, la clave cambia.","c":"Después, borra esta invitación.","k1":"Clave nueva","k2":"Repite la clave","ot":"Otra","e2":"Las claves no coinciden","mc":"Crear mi código","sd":"Enviar","cy":"Copiar","h7":"Manda este código por el mismo chat. Cuando te llegue el archivo, ábrelo, escribe tu clave en Buscar y pulsa Intro."},"en":{"dir":"ltr","a":"Someone wants to send you a file that only you will be able to open. For that you need a passphrase: this page makes it, and it never leaves your phone.","b":"Write it on paper, never in a note or in the chat. If you leave this page, the passphrase changes.","c":"Afterwards, delete this invitation.","k1":"New passphrase","k2":"Repeat the passphrase","ot":"Another","e2":"The passphrases do not match","mc":"Make my code","sd":"Send","cy":"Copy","h7":"Send this code through the same chat. When the file arrives, open it, type your passphrase in Search and press Enter."},"fr":{"dir":"ltr","a":"Quelqu’un veut vous envoyer un fichier que vous seul pourrez ouvrir. Pour cela, il vous faut une phrase secrète : cette page la crée et elle ne quitte jamais votre téléphone.","b":"Notez-la sur papier, jamais dans une note ni dans la discussion. Si vous quittez cette page, la phrase secrète change.","c":"Ensuite, supprimez cette invitation.","k1":"Nouvelle phrase secrète","k2":"Répétez la phrase secrète","ot":"Une autre","e2":"Les deux phrases ne correspondent pas","mc":"Créer mon code","sd":"Envoyer","cy":"Copier","h7":"Envoyez ce code par la même discussion. Quand le fichier arrive, ouvrez-le, tapez votre phrase secrète dans Rechercher et appuyez sur Entrée."},"pt":{"dir":"ltr","a":"Alguém quer enviar a você um arquivo que só você poderá abrir. Para isso, você precisa de uma senha: esta página a cria, e ela não sai do seu telefone.","b":"Anote-a em papel, nunca numa nota nem na conversa. Se você sair desta página, a senha muda.","c":"Depois, apague este convite.","k1":"Nova senha","k2":"Repita a senha","ot":"Outra","e2":"As senhas não coincidem","mc":"Criar meu código","sd":"Enviar","cy":"Copiar","h7":"Envie este código pela mesma conversa. Quando o arquivo chegar, abra-o, digite sua senha em Buscar e toque em Enter."},"ru":{"dir":"ltr","a":"Кто-то хочет отправить вам файл, который сможете открыть только вы. Для этого нужен пароль: его создаёт эта страница, и он не покидает ваш телефон.","b":"Запишите его на бумаге, никогда не в заметке и не в чате. Если вы уйдёте с этой страницы, пароль изменится.","c":"После этого удалите это приглашение.","k1":"Новый пароль","k2":"Повторите пароль","ot":"Другой","e2":"Пароли не совпадают","mc":"Создать мой код","sd":"Отправить","cy":"Копировать","h7":"Отправьте этот код через тот же чат. Когда придёт файл, откройте его, введите пароль в поле «Поиск» и нажмите Enter."},"ar":{"dir":"rtl","a":"شخص ما يريد أن يرسل إليك ملفًا لا يستطيع فتحه أحد غيرك. لذلك تحتاج إلى كلمة سر: تُنشئها هذه الصفحة، ولا تخرج من هاتفك.","b":"اكتبها على ورقة، لا في ملاحظة ولا في المحادثة أبدًا. إذا غادرت هذه الصفحة، تتغير كلمة السر.","c":"بعد ذلك، احذف هذه الدعوة.","k1":"كلمة سر جديدة","k2":"أعد كتابة كلمة السر","ot":"غيرها","e2":"كلمتا السر غير متطابقتين","mc":"إنشاء رمزي","sd":"إرسال","cy":"نسخ","h7":"أرسل هذا الرمز عبر المحادثة نفسها. عندما يصلك الملف، افتحه واكتب كلمة السر في «بحث» واضغط Enter."},"fa":{"dir":"rtl","a":"کسی می‌خواهد فایلی برایتان بفرستد که فقط شما می‌توانید بازش کنید. برای این کار یک رمز لازم دارید: این صفحه آن را می‌سازد و از گوشی شما بیرون نمی‌رود.","b":"آن را روی کاغذ بنویسید، هرگز در یادداشت یا در گفتگو. اگر از این صفحه بیرون بروید، رمز عوض می‌شود.","c":"بعد از آن، این دعوت‌نامه را پاک کنید.","k1":"رمز جدید","k2":"تکرار رمز","ot":"یکی دیگر","e2":"رمزها یکسان نیستند","mc":"ساختن کد من","sd":"ارسال","cy":"کپی","h7":"این کد را از همان گفتگو بفرستید. وقتی فایل رسید، آن را باز کنید، رمز را در «جستجو» بنویسید و Enter را بزنید."},"zh":{"dir":"ltr","a":"有人想给你发送一个只有你能打开的文件。为此你需要一个密码：它由本页面生成，不会离开你的手机。","b":"把它写在纸上，绝不要写在备忘录或聊天里。如果离开本页面，密码会改变。","c":"之后，请删除这份邀请。","k1":"新密码","k2":"再输入一次","ot":"换一个","e2":"两次输入不一致","mc":"生成我的代码","sd":"发送","cy":"复制","h7":"通过同一个聊天发送这个代码。收到文件后，打开它，在“搜索”框中输入你的密码并按回车。"},"id":{"dir":"ltr","a":"Seseorang ingin mengirimi Anda berkas yang hanya bisa Anda buka. Untuk itu Anda perlu kata sandi: halaman ini membuatnya, dan kata sandi itu tidak pernah keluar dari ponsel Anda.","b":"Tulis di kertas, jangan pernah di catatan atau di obrolan. Jika Anda meninggalkan halaman ini, kata sandinya berubah.","c":"Setelah itu, hapus undangan ini.","k1":"Kata sandi baru","k2":"Ulangi kata sandi","ot":"Yang lain","e2":"Kata sandi tidak sama","mc":"Buat kode saya","sd":"Kirim","cy":"Salin","h7":"Kirim kode ini lewat obrolan yang sama. Saat berkas tiba, buka, ketik kata sandi Anda di Cari, lalu tekan Enter."},"vi":{"dir":"ltr","a":"Có người muốn gửi cho bạn một tệp mà chỉ bạn mới mở được. Vì vậy bạn cần một mật khẩu: trang này tạo ra nó và nó không rời khỏi điện thoại của bạn.","b":"Hãy ghi ra giấy, đừng bao giờ ghi vào ghi chú hay cuộc trò chuyện. Nếu bạn rời trang này, mật khẩu sẽ thay đổi.","c":"Sau đó, hãy xóa lời mời này.","k1":"Mật khẩu mới","k2":"Nhập lại mật khẩu","ot":"Mật khẩu khác","e2":"Hai mật khẩu không khớp","mc":"Tạo mã của tôi","sd":"Gửi","cy":"Sao chép","h7":"Gửi mã này qua cùng cuộc trò chuyện. Khi tệp đến, hãy mở tệp, nhập mật khẩu vào ô Tìm kiếm rồi nhấn Enter."},"my":{"dir":"ltr","a":"တစ်စုံတစ်ယောက်က သင်တစ်ဦးတည်းသာ ဖွင့်နိုင်မည့် ဖိုင်တစ်ခုကို ပို့လိုပါသည်။ ထို့အတွက် စကားဝှက်တစ်ခု လိုအပ်ပါသည် - ဤစာမျက်နှာက ပြုလုပ်ပေးပြီး သင့်ဖုန်းမှ ထွက်မသွားပါ။","b":"စာရွက်ပေါ်တွင် ရေးထားပါ၊ မှတ်စု သို့မဟုတ် ချက်ထဲတွင် ဘယ်တော့မှ မရေးပါနှင့်။ ဤစာမျက်နှာမှ ထွက်သွားလျှင် စကားဝှက် ပြောင်းသွားပါမည်။","c":"ပြီးလျှင် ဤဖိတ်စာကို ဖျက်ပါ။","k1":"စကားဝှက်အသစ်","k2":"စကားဝှက်ကို ထပ်ရိုက်ပါ","ot":"နောက်တစ်ခု","e2":"စကားဝှက်နှစ်ခု မတူညီပါ","mc":"ကျွန်ုပ်၏ကုဒ် ပြုလုပ်ရန်","sd":"ပို့ရန်","cy":"ကူးယူရန်","h7":"ဤကုဒ်ကို တူညီသော ချက်မှ ပို့ပါ။ ဖိုင်ရောက်လာသောအခါ ဖွင့်ပြီး ရှာဖွေရေးအကွက်တွင် သင့်စကားဝှက်ကို ရိုက်ထည့်ကာ Enter နှိပ်ပါ။"},"tr":{"dir":"ltr","a":"Biri size yalnızca sizin açabileceğiniz bir dosya göndermek istiyor. Bunun için bir parolaya ihtiyacınız var: bu sayfa onu oluşturur ve parola telefonunuzdan dışarı çıkmaz.","b":"Kâğıda yazın; asla bir notta ya da sohbette değil. Bu sayfadan çıkarsanız parola değişir.","c":"Sonra bu daveti silin.","k1":"Yeni parola","k2":"Parolayı tekrarlayın","ot":"Başka","e2":"Parolalar eşleşmiyor","mc":"Kodumu oluştur","sd":"Gönder","cy":"Kopyala","h7":"Bu kodu aynı sohbetten gönderin. Dosya gelince açın, parolanızı Ara kutusuna yazıp Enter’a basın."},"hi":{"dir":"ltr","a":"कोई आपको ऐसी फ़ाइल भेजना चाहता है जिसे केवल आप खोल पाएँगे। इसके लिए आपको एक पासवर्ड चाहिए: यह पेज उसे बनाता है और वह आपके फ़ोन से बाहर नहीं जाता।","b":"इसे कागज़ पर लिखें, कभी किसी नोट या चैट में नहीं। अगर आप यह पेज छोड़ते हैं, तो पासवर्ड बदल जाता है।","c":"इसके बाद यह निमंत्रण मिटा दें।","k1":"नया पासवर्ड","k2":"पासवर्ड दोबारा लिखें","ot":"दूसरा","e2":"दोनों पासवर्ड एक जैसे नहीं हैं","mc":"मेरा कोड बनाएँ","sd":"भेजें","cy":"कॉपी करें","h7":"यह कोड उसी चैट से भेजें। फ़ाइल आने पर उसे खोलें, अपना पासवर्ड खोज बॉक्स में लिखें और Enter दबाएँ।"},"ko":{"dir":"ltr","a":"누군가 당신만 열 수 있는 파일을 보내려고 합니다. 이를 위해 암호가 필요합니다. 암호는 이 페이지가 만들며 휴대폰 밖으로 나가지 않습니다.","b":"종이에 적으세요. 메모나 채팅에는 절대 적지 마세요. 이 페이지를 벗어나면 암호가 바뀝니다.","c":"그다음 이 초대장을 삭제하세요.","k1":"새 암호","k2":"암호 다시 입력","ot":"다른 암호","e2":"암호가 일치하지 않습니다","mc":"내 코드 만들기","sd":"보내기","cy":"복사","h7":"이 코드를 같은 채팅으로 보내세요. 파일이 오면 열어서 검색에 암호를 입력하고 Enter를 누르세요."},"bn":{"dir":"ltr","a":"কেউ আপনাকে এমন একটি ফাইল পাঠাতে চায় যা শুধু আপনিই খুলতে পারবেন। এর জন্য একটি পাসওয়ার্ড দরকার: এই পাতা সেটি তৈরি করে, এবং সেটি আপনার ফোনের বাইরে যায় না।","b":"এটি কাগজে লিখে রাখুন, কখনও কোনো নোটে বা চ্যাটে নয়। এই পাতা ছেড়ে গেলে পাসওয়ার্ড বদলে যাবে।","c":"এরপর এই আমন্ত্রণটি মুছে ফেলুন।","k1":"নতুন পাসওয়ার্ড","k2":"পাসওয়ার্ড আবার লিখুন","ot":"অন্যটি","e2":"পাসওয়ার্ড দুটি মিলছে না","mc":"আমার কোড তৈরি করুন","sd":"পাঠান","cy":"কপি করুন","h7":"এই কোডটি একই চ্যাট দিয়ে পাঠান। ফাইলটি এলে খুলুন, সার্চ বক্সে আপনার পাসওয়ার্ড লিখে Enter চাপুন।"},"ha":{"dir":"ltr","a":"Wani yana so ya aiko maka da fayil wanda kai kaɗai za ka iya buɗewa. Saboda haka kana buƙatar kalmar sirri: wannan shafin ne yake yin ta, kuma ba ta fita daga wayarka.","b":"Rubuta ta a takarda, kada ka taɓa rubuta ta a cikin rubutu ko a hira. Idan ka bar wannan shafin, kalmar sirrin za ta canza.","c":"Bayan haka, goge wannan gayyatar.","k1":"Sabuwar kalmar sirri","k2":"Maimaita kalmar sirri","ot":"Wata","e2":"Kalmomin sirrin ba su yi daidai ba","mc":"Yi lambata","sd":"Aika","cy":"Kwafa","h7":"Aika wannan lambar ta wannan hira ɗaya. Idan fayil ɗin ya iso, buɗe shi, rubuta kalmar sirrinka a akwatin nema, sannan ka danna Enter."},"ckb":{"dir":"rtl","a":"کەسێک دەیەوێت فایلێکت بۆ بنێرێت کە تەنها تۆ دەتوانیت بیکەیتەوە. بۆ ئەمە پێویستت بە وشەی نهێنییە: ئەم پەڕەیە دروستی دەکات و لە مۆبایلەکەت دەرناچێت.","b":"لەسەر کاغەز بینووسە، هەرگیز لە تێبینی یان چاتدا نا. ئەگەر ئەم پەڕەیە جێبهێڵیت، وشەی نهێنییەکە دەگۆڕێت.","c":"دواتر ئەم بانگهێشتە بسڕەوە.","k1":"وشەی نهێنیی نوێ","k2":"دووبارە وشەی نهێنی بنووسەوە","ot":"یەکێکی تر","e2":"وشە نهێنییەکان وەک یەک نین","mc":"دروستکردنی کۆدەکەم","sd":"ناردن","cy":"لەبەرگرتنەوە","h7":"ئەم کۆدە لە هەمان چاتەوە بنێرە. کاتێک فایلەکە گەیشت، بیکەرەوە، وشەی نهێنییەکەت لە سندووقی گەڕان بنووسە و Enter دابگرە."},"ug":{"dir":"rtl","a":"بىرەيلەن سىزگە پەقەت سىزلا ئاچالايدىغان بىر ھۆججەت ئەۋەتمەكچى. بۇنىڭ ئۈچۈن سىزگە بىر پارول كېرەك: ئۇنى بۇ بەت ياسايدۇ، ئۇ تېلېفونىڭىزدىن سىرتقا چىقمايدۇ.","b":"ئۇنى قەغەزگە يېزىڭ، ھەرگىز خاتىرە ياكى سۆھبەتكە يازماڭ. بۇ بەتتىن ئايرىلسىڭىز، پارول ئۆزگىرىدۇ.","c":"ئاندىن بۇ تەكلىپنامىنى ئۆچۈرۈڭ.","k1":"يېڭى پارول","k2":"پارولنى قايتا كىرگۈزۈڭ","ot":"باشقىسى","e2":"پاروللار ماس كەلمىدى","mc":"كودۇمنى ياساش","sd":"ئەۋەتىش","cy":"كۆچۈرۈش","h7":"بۇ كودنى ئوخشاش سۆھبەت ئارقىلىق ئەۋەتىڭ. ھۆججەت كەلگەندە ئۇنى ئېچىپ، پارولىڭىزنى ئىزدەش رامكىسىغا يېزىپ Enter نى بېسىڭ."},"ur":{"dir":"rtl","a":"کوئی آپ کو ایسی فائل بھیجنا چاہتا ہے جسے صرف آپ کھول سکیں گے۔ اس کے لیے آپ کو ایک پاس ورڈ چاہیے: یہ صفحہ اسے بناتا ہے اور یہ آپ کے فون سے باہر نہیں جاتا۔","b":"اسے کاغذ پر لکھیں، کبھی کسی نوٹ یا چیٹ میں نہیں۔ اگر آپ یہ صفحہ چھوڑ دیں تو پاس ورڈ بدل جاتا ہے۔","c":"اس کے بعد یہ دعوت نامہ مٹا دیں۔","k1":"نیا پاس ورڈ","k2":"پاس ورڈ دوبارہ لکھیں","ot":"کوئی اور","e2":"دونوں پاس ورڈ ایک جیسے نہیں ہیں","mc":"میرا کوڈ بنائیں","sd":"بھیجیں","cy":"کاپی کریں","h7":"یہ کوڈ اسی چیٹ سے بھیجیں۔ جب فائل آ جائے تو اسے کھولیں، اپنا پاس ورڈ تلاش کے خانے میں لکھیں اور Enter دبائیں۔"},"so":{"dir":"ltr","a":"Qof ayaa doonaya inuu kuu soo diro fayl adiga keliya furi kara. Taas awgeed waxaad u baahan tahay eray sir ah: boggan ayaa sameeya, mana ka baxo taleefankaaga.","b":"Ku qor warqad, weligaa ha ku qorin qoraal ama sheeko. Haddii aad ka baxdo boggan, erayga sirta ahi wuu is beddelaa.","c":"Kadib tirtir casuumaddan.","k1":"Eray sir ah oo cusub","k2":"Ku celi erayga sirta ah","ot":"Mid kale","e2":"Erayada sirta ahi isku mid ma aha","mc":"Samee koodkayga","sd":"Dir","cy":"Koobiyee","h7":"Koodkan ku dir isla sheekada. Marka faylku yimaado, fur, ku qor erayga sirta ah sanduuqa raadinta oo riix Enter."},"bo":{"dir":"ltr","a":"མི་ཞིག་གིས་ཁྱེད་རང་ཁོ་ནས་ཁ་ཕྱེ་ཐུབ་པའི་ཡིག་ཆ་ཞིག་གཏོང་འདོད་ཡོད། དེའི་ཆེད་དུ་གསང་ཨང་ཞིག་དགོས། ཤོག་ངོས་འདིས་བཟོ་གི་ཡོད་ལ། ཁྱེད་ཀྱི་ཁ་པར་ནས་ཕྱི་ལ་མི་འགྲོ།","b":"ཤོག་བུའི་སྟེང་དུ་འབྲི། ཟིན་བྲིས་སམ་གླེང་མོལ་ནང་ནམ་ཡང་མ་འབྲི། ཤོག་ངོས་འདི་ནས་ཕྱིར་ཐོན་ན་གསང་ཨང་འགྱུར་གྱི་རེད།","c":"དེ་རྗེས་མགྲོན་འབོད་འདི་སུབ།","k1":"གསང་ཨང་གསར་པ།","k2":"གསང་ཨང་ཡང་བསྐྱར་བྲིས།","ot":"གཞན་ཞིག","e2":"གསང་ཨང་གཉིས་མི་མཐུན།","mc":"ངའི་ཨང་རྟགས་བཟོ།","sd":"གཏོང་བ།","cy":"བཤུ།","h7":"ཨང་རྟགས་འདི་གླེང་མོལ་དེ་ཉིད་བརྒྱུད་ནས་གཏོང་། ཡིག་ཆ་འབྱོར་དུས་ཁ་ཕྱེ་ནས། འཚོལ་སྒམ་དུ་གསང་ཨང་བྲིས་ནས་ Enter གནོན།"},"sw":{"dir":"ltr","a":"Mtu fulani anataka kukutumia faili ambalo wewe tu utaweza kulifungua. Kwa hiyo unahitaji nenosiri: ukurasa huu unalitengeneza, nalo halitoki kwenye simu yako.","b":"Liandike kwenye karatasi, kamwe si kwenye dokezo wala kwenye gumzo. Ukitoka kwenye ukurasa huu, nenosiri hubadilika.","c":"Baadaye, futa mwaliko huu.","k1":"Nenosiri jipya","k2":"Rudia nenosiri","ot":"Lingine","e2":"Manenosiri hayalingani","mc":"Tengeneza msimbo wangu","sd":"Tuma","cy":"Nakili","h7":"Tuma msimbo huu kupitia gumzo lilelile. Faili likifika, lifungue, andika nenosiri lako kwenye Tafuta kisha bonyeza Enter."},"hne":{"dir":"ltr","a":"कोई आपको ऐसी फ़ाइल भेजना चाहता है जिसे केवल आप खोल पाएँगे। इसके लिए आपको एक पासवर्ड चाहिए: यह पेज उसे बनाता है और वह आपके फ़ोन से बाहर नहीं जाता।","b":"इसे कागज़ पर लिखें, कभी किसी नोट या चैट में नहीं। अगर आप यह पेज छोड़ते हैं, तो पासवर्ड बदल जाता है।","c":"इसके बाद यह निमंत्रण मिटा दें।","k1":"नया पासवर्ड","k2":"पासवर्ड दोबारा लिखें","ot":"दूसरा","e2":"दोनों पासवर्ड एक जैसे नहीं हैं","mc":"मेरा कोड बनाएँ","sd":"भेजें","cy":"कॉपी करें","h7":"यह कोड उसी चैट से भेजें। फ़ाइल आने पर उसे खोलें, अपना पासवर्ड खोज बॉक्स में लिखें और Enter दबाएँ।"},"om":{"dir":"ltr","a":"Namni tokko faayila ati qofti banuu dandeessu siif erguu barbaada. Kanaaf jecha icciitii si barbaachisa: fuulli kun ni uuma, bilbila kee irraa hin ba’u.","b":"Waraqaa irratti barreessi; yaadannoo ykn haasaa keessatti gonkumaa hin barreessin. Fuula kana yoo dhiifte, jechi icciitii ni jijjiirama.","c":"Sana booda affeerraa kana haqi.","k1":"Jecha icciitii haaraa","k2":"Jecha icciitii irra deebi’i","ot":"Kan biraa","e2":"Jechoonni icciitii wal hin simne","mc":"Koodii koo uumi","sd":"Ergi","cy":"Kooppii godhi","h7":"Koodii kana haasaa sanuma keessaan ergi. Faayilli yoo dhufe, bani, jecha icciitii kee saanduqa barbaachaa keessatti barreessii Enter tuqi."},"or":{"dir":"ltr","a":"କେହି ଜଣେ ଆପଣଙ୍କୁ ଏପରି ଏକ ଫାଇଲ୍ ପଠାଇବାକୁ ଚାହାଁନ୍ତି ଯାହା କେବଳ ଆପଣ ଖୋଲିପାରିବେ। ସେଥିପାଇଁ ଏକ ପାସୱାର୍ଡ ଦରକାର: ଏହି ପୃଷ୍ଠା ଏହାକୁ ତିଆରି କରେ, ଏବଂ ଏହା ଆପଣଙ୍କ ଫୋନ୍ ବାହାରକୁ ଯାଏ ନାହିଁ।","b":"ଏହାକୁ କାଗଜରେ ଲେଖନ୍ତୁ, କେବେ ବି ନୋଟ୍ କିମ୍ବା ଚାଟ୍‌ରେ ନୁହେଁ। ଏହି ପୃଷ୍ଠା ଛାଡ଼ିଲେ ପାସୱାର୍ଡ ବଦଳିଯିବ।","c":"ତାପରେ ଏହି ନିମନ୍ତ୍ରଣ ଡିଲିଟ୍ କରନ୍ତୁ।","k1":"ନୂଆ ପାସୱାର୍ଡ","k2":"ପାସୱାର୍ଡ ପୁଣି ଲେଖନ୍ତୁ","ot":"ଅନ୍ୟ ଏକ","e2":"ଦୁଇଟି ପାସୱାର୍ଡ ମେଳ ଖାଉନାହିଁ","mc":"ମୋ କୋଡ୍ ତିଆରି କରନ୍ତୁ","sd":"ପଠାନ୍ତୁ","cy":"କପି କରନ୍ତୁ","h7":"ଏହି କୋଡ୍ ସେହି ଚାଟ୍ ଦ୍ୱାରା ପଠାନ୍ତୁ। ଫାଇଲ୍ ଆସିଲେ ଖୋଲନ୍ତୁ, ଖୋଜା ବାକ୍ସରେ ଆପଣଙ୍କ ପାସୱାର୍ଡ ଲେଖି Enter ଦବାନ୍ତୁ।"},"az":{"dir":"ltr","a":"Kimsə sizə yalnız sizin aça biləcəyiniz bir fayl göndərmək istəyir. Bunun üçün şifrə lazımdır: onu bu səhifə yaradır və o, telefonunuzdan kənara çıxmır.","b":"Onu kağıza yazın, heç vaxt qeyddə və ya söhbətdə yox. Bu səhifədən çıxsanız, şifrə dəyişir.","c":"Sonra bu dəvəti silin.","k1":"Yeni şifrə","k2":"Şifrəni təkrarlayın","ot":"Başqası","e2":"Şifrələr uyğun gəlmir","mc":"Kodumu yarat","sd":"Göndər","cy":"Kopyala","h7":"Bu kodu eyni söhbətlə göndərin. Fayl gələndə onu açın, şifrənizi Axtar xanasına yazın və Enter basın."},"ne":{"dir":"ltr","a":"कसैले तपाईंलाई तपाईंले मात्र खोल्न सक्ने एउटा फाइल पठाउन चाहन्छ। त्यसका लागि एउटा पासवर्ड चाहिन्छ: यो पृष्ठले बनाउँछ, र यो तपाईंको फोनबाट बाहिर जाँदैन।","b":"यसलाई कागजमा लेख्नुहोस्, कहिल्यै नोट वा च्याटमा होइन। यो पृष्ठ छोड्नुभयो भने पासवर्ड बदलिन्छ।","c":"त्यसपछि यो निम्तो मेटाउनुहोस्।","k1":"नयाँ पासवर्ड","k2":"पासवर्ड फेरि लेख्नुहोस्","ot":"अर्को","e2":"पासवर्ड मिलेन","mc":"मेरो कोड बनाउनुहोस्","sd":"पठाउनुहोस्","cy":"कपी गर्नुहोस्","h7":"यो कोड उही च्याटबाट पठाउनुहोस्। फाइल आएपछि खोल्नुहोस्, खोज बाकसमा आफ्नो पासवर्ड टाइप गरी Enter थिच्नुहोस्।"},"ta":{"dir":"ltr","a":"நீங்கள் மட்டுமே திறக்கக்கூடிய ஒரு கோப்பை யாரோ உங்களுக்கு அனுப்ப விரும்புகிறார். அதற்கு ஒரு கடவுச்சொல் தேவை: இந்தப் பக்கம் அதை உருவாக்குகிறது, அது உங்கள் தொலைபேசியை விட்டு வெளியே போவதில்லை.","b":"அதைக் காகிதத்தில் எழுதுங்கள்; குறிப்பிலோ அரட்டையிலோ ஒருபோதும் எழுதாதீர்கள். இந்தப் பக்கத்தை விட்டு வெளியேறினால் கடவுச்சொல் மாறிவிடும்.","c":"பிறகு இந்த அழைப்பை நீக்கவும்.","k1":"புதிய கடவுச்சொல்","k2":"கடவுச்சொல்லை மீண்டும் உள்ளிடவும்","ot":"வேறொன்று","e2":"கடவுச்சொற்கள் பொருந்தவில்லை","mc":"என் குறியீட்டை உருவாக்கு","sd":"அனுப்பு","cy":"நகலெடு","h7":"இந்தக் குறியீட்டை அதே அரட்டை வழியாக அனுப்பவும். கோப்பு வந்ததும் அதைத் திறந்து, தேடல் பெட்டியில் உங்கள் கடவுச்சொல்லை எழுதி Enter அழுத்தவும்."},"te":{"dir":"ltr","a":"మీరు మాత్రమే తెరవగలిగే ఒక ఫైల్‌ను ఎవరో మీకు పంపాలనుకుంటున్నారు. దానికి ఒక పాస్‌వర్డ్ అవసరం: ఈ పేజీ దాన్ని తయారు చేస్తుంది, అది మీ ఫోన్ బయటికి వెళ్లదు.","b":"దాన్ని కాగితంపై రాయండి, ఎప్పుడూ గమనికలో లేదా చాట్‌లో కాదు. ఈ పేజీ నుండి బయటకు వెళ్తే పాస్‌వర్డ్ మారిపోతుంది.","c":"తర్వాత ఈ ఆహ్వానాన్ని తొలగించండి.","k1":"కొత్త పాస్‌వర్డ్","k2":"పాస్‌వర్డ్‌ను మళ్లీ నమోదు చేయండి","ot":"మరొకటి","e2":"పాస్‌వర్డ్‌లు సరిపోలడం లేదు","mc":"నా కోడ్ తయారు చేయండి","sd":"పంపండి","cy":"కాపీ చేయండి","h7":"ఈ కోడ్‌ను అదే చాట్ ద్వారా పంపండి. ఫైల్ వచ్చాక దాన్ని తెరిచి, శోధన పెట్టెలో మీ పాస్‌వర్డ్ టైప్ చేసి Enter నొక్కండి."},"kn":{"dir":"ltr","a":"ನೀವು ಮಾತ್ರ ತೆರೆಯಬಹುದಾದ ಒಂದು ಫೈಲ್ ಅನ್ನು ಯಾರೋ ನಿಮಗೆ ಕಳುಹಿಸಲು ಬಯಸುತ್ತಾರೆ. ಅದಕ್ಕೆ ಒಂದು ಪಾಸ್‌ವರ್ಡ್ ಬೇಕು: ಈ ಪುಟ ಅದನ್ನು ಮಾಡುತ್ತದೆ, ಮತ್ತು ಅದು ನಿಮ್ಮ ಫೋನ್‌ನಿಂದ ಹೊರಗೆ ಹೋಗುವುದಿಲ್ಲ.","b":"ಅದನ್ನು ಕಾಗದದ ಮೇಲೆ ಬರೆಯಿರಿ, ಎಂದಿಗೂ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಅಥವಾ ಚಾಟ್‌ನಲ್ಲಿ ಅಲ್ಲ. ಈ ಪುಟದಿಂದ ಹೊರಗೆ ಹೋದರೆ ಪಾಸ್‌ವರ್ಡ್ ಬದಲಾಗುತ್ತದೆ.","c":"ನಂತರ ಈ ಆಹ್ವಾನವನ್ನು ಅಳಿಸಿ.","k1":"ಹೊಸ ಪಾಸ್‌ವರ್ಡ್","k2":"ಪಾಸ್‌ವರ್ಡ್ ಮತ್ತೆ ನಮೂದಿಸಿ","ot":"ಮತ್ತೊಂದು","e2":"ಪಾಸ್‌ವರ್ಡ್‌ಗಳು ಹೊಂದಿಕೆಯಾಗುತ್ತಿಲ್ಲ","mc":"ನನ್ನ ಕೋಡ್ ಮಾಡಿ","sd":"ಕಳುಹಿಸಿ","cy":"ನಕಲಿಸಿ","h7":"ಈ ಕೋಡ್ ಅನ್ನು ಅದೇ ಚಾಟ್ ಮೂಲಕ ಕಳುಹಿಸಿ. ಫೈಲ್ ಬಂದಾಗ ಅದನ್ನು ತೆರೆಯಿರಿ, ಹುಡುಕಾಟ ಬಾಕ್ಸ್‌ನಲ್ಲಿ ನಿಮ್ಮ ಪಾಸ್‌ವರ್ಡ್ ಟೈಪ್ ಮಾಡಿ Enter ಒತ್ತಿರಿ."},"am":{"dir":"ltr","a":"አንድ ሰው እርስዎ ብቻ መክፈት የሚችሉትን ፋይል ሊልክልዎ ይፈልጋል። ለዚህ የይለፍ ቃል ያስፈልግዎታል፤ ይህ ገጽ ይፈጥረዋል፣ ከስልክዎም አይወጣም።","b":"በወረቀት ላይ ይጻፉት፤ በማስታወሻ ወይም በውይይት ውስጥ ፈጽሞ አይጻፉት። ከዚህ ገጽ ከወጡ የይለፍ ቃሉ ይቀየራል።","c":"ከዚያ ይህን ግብዣ ይሰርዙት።","k1":"አዲስ የይለፍ ቃል","k2":"የይለፍ ቃሉን እንደገና ያስገቡ","ot":"ሌላ","e2":"የይለፍ ቃሎቹ አይዛመዱም","mc":"የእኔን ኮድ ፍጠር","sd":"ላክ","cy":"ቅዳ","h7":"ይህን ኮድ በዚያው ውይይት ይላኩ። ፋይሉ ሲደርስ ይክፈቱት፣ የይለፍ ቃልዎን በፍለጋ ሳጥን ውስጥ ይጻፉና Enter ይጫኑ።"},"tk":{"dir":"ltr","a":"Kimdir biri size diňe siziň açyp biljek faýlyňyzy ibermek isleýär. Munuň üçin parol gerek: ony şu sahypa döredýär we ol telefonyňyzdan daşary çykmaýar.","b":"Ony kagyza ýazyň, hiç haçan bellikde ýa-da çatda däl. Bu sahypadan çyksaňyz, parol üýtgeýär.","c":"Soňra bu çakylygy pozuň.","k1":"Täze parol","k2":"Paroly gaýtalaň","ot":"Başga","e2":"Parollar gabat gelmeýär","mc":"Kodumy döret","sd":"Iber","cy":"Göçür","h7":"Bu kody şol bir çat arkaly iberiň. Faýl gelende açyň, parolyňyzy «Gözle» gutusyna ýazyp Enter basyň."},"uz":{"dir":"ltr","a":"Kimdir sizga faqat siz ocha oladigan fayl yubormoqchi. Buning uchun parol kerak: uni shu sahifa yaratadi va u telefoningizdan tashqariga chiqmaydi.","b":"Uni qogʻozga yozing, hech qachon qaydda yoki suhbatda emas. Bu sahifadan chiqsangiz, parol oʻzgaradi.","c":"Keyin bu taklifnomani oʻchiring.","k1":"Yangi parol","k2":"Parolni qaytaring","ot":"Boshqasi","e2":"Parollar mos kelmadi","mc":"Kodimni yaratish","sd":"Yuborish","cy":"Nusxalash","h7":"Bu kodni oʻsha suhbat orqali yuboring. Fayl kelganda uni oching, parolingizni «Qidirish» maydoniga yozing va Enter bosing."},"tg":{"dir":"ltr","a":"Касе мехоҳад ба шумо файле фиристад, ки танҳо шумо онро кушода метавонед. Барои ин парол лозим аст: онро ҳамин саҳифа месозад ва он аз телефони шумо берун намеравад.","b":"Онро дар коғаз нависед, ҳеҷ гоҳ дар ёддошт ё чат не. Агар аз ин саҳифа бароед, парол иваз мешавад.","c":"Баъд ин даъватномаро нест кунед.","k1":"Пароли нав","k2":"Паролро такрор кунед","ot":"Дигар","e2":"Паролҳо мувофиқат намекунанд","mc":"Сохтани коди ман","sd":"Фиристодан","cy":"Нусхабардорӣ","h7":"Ин кодро тавассути ҳамон чат фиристед. Вақте ки файл расид, онро кушоед, паролро дар «Ҷустуҷӯ» нависед ва Enter-ро пахш кунед."},"ms":{"dir":"ltr","a":"Seseorang mahu menghantar kepada anda fail yang hanya anda boleh buka. Untuk itu anda perlukan kata laluan: halaman ini membuatnya, dan ia tidak keluar dari telefon anda.","b":"Tulis di atas kertas, jangan sekali-kali dalam nota atau sembang. Jika anda keluar dari halaman ini, kata laluan berubah.","c":"Selepas itu, padam jemputan ini.","k1":"Kata laluan baharu","k2":"Ulang kata laluan","ot":"Lain","e2":"Kata laluan tidak sepadan","mc":"Buat kod saya","sd":"Hantar","cy":"Salin","h7":"Hantar kod ini melalui sembang yang sama. Apabila fail tiba, buka, taip kata laluan anda dalam Cari dan tekan Enter."}}</script>
